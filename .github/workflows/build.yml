name: Build Desktop Installers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ==========================================
  # WINDOWS
  # ==========================================
  windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare Windows Node sidecar
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null

          $nodeVersion = "20.19.5"
          $url = "https://nodejs.org/dist/v$nodeVersion/node-v$nodeVersion-win-x64.zip"

          Write-Host "Downloading Node.js from:"
          Write-Host $url

          curl.exe -fL $url -o node.zip

          if (!(Test-Path "node.zip")) {
            throw "Node.js ZIP was not downloaded."
          }

          $size = (Get-Item "node.zip").Length

          if ($size -lt 1000000) {
            throw "Downloaded Node.js ZIP looks invalid. Size: $size bytes"
          }

          Write-Host "Extracting Node.js..."

          Expand-Archive -Path node.zip -DestinationPath "node-extracted" -Force

          $nodePath = "node-extracted/node-v$nodeVersion-win-x64/node.exe"

          if (!(Test-Path $nodePath)) {
            throw "node.exe was not found at $nodePath"
          }

          Copy-Item `
            $nodePath `
            "src-tauri/binaries/node-x86_64-pc-windows-msvc.exe" `
            -Force

          Write-Host "Windows Node sidecar ready."

      - name: Build Next.js
        run: npm run build

      - name: Build Tauri Windows installer
        run: npm run tauri:build -- --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Shop-Manager-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error


  # ==========================================
  # MAC - APPLE SILICON
  # ==========================================
  macos-arm64:
    name: Build macOS Apple Silicon Installer
    runs-on: macos-14

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Prepare macOS Node sidecar
        shell: bash
        run: |
          set -e

          mkdir -p src-tauri/binaries

          NODE_VERSION="20.19.5"

          URL="https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-darwin-arm64.tar.gz"

          echo "Downloading Node.js from:"
          echo "$URL"

          curl -fL "$URL" -o node.tar.gz

          if [ ! -s node.tar.gz ]; then
            echo "Node.js archive was not downloaded."
            exit 1
          fi

          echo "Extracting Node.js..."

          tar -xzf node.tar.gz

          NODE_PATH="node-v${NODE_VERSION}-darwin-arm64/bin/node"

          if [ ! -f "$NODE_PATH" ]; then
            echo "Node binary not found:"
            echo "$NODE_PATH"
            exit 1
          fi

          cp "$NODE_PATH" \
            "src-tauri/binaries/node-aarch64-apple-darwin"

          chmod +x \
            "src-tauri/binaries/node-aarch64-apple-darwin"

          echo "macOS Node sidecar ready."

      - name: Build Next.js
        run: npm run build

      - name: Build Tauri macOS DMG
        run: npm run tauri:build -- --bundles dmg

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: Shop-Manager-macOS-Apple-Silicon
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
