[package]
name = "shop-manager"
version = "1.0.0"
description = "Offline shop purchase & salary management desktop app"
edition = "2021"
default-run = "shop-manager"

[build-dependencies]
tauri-build = { version = "1", features = [] }

[dependencies]
tauri = { version = "1", features = ["shell-sidecar"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "shop-manager"
path = "src/main.rs"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
